name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; individual jobs opt into more if needed.
permissions:
  contents: read

env:
  # Shared placeholder env for build/start in CI. These are NOT secrets — they
  # only let Next.js compile and boot for static analysis and smoke tests.
  # Valid-format dummy Clerk key (decodes to clerk.example.com$) so ClerkProvider
  # initializes during prerender without a real key.
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
  CLERK_SECRET_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/dashboard"
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/dashboard"
  UPLOADTHING_TOKEN: "placeholder"
  MUX_TOKEN_ID: "placeholder"
  MUX_TOKEN_SECRET: "placeholder"
  STRIPE_API_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  commitlint:
    name: Commit Lint
    # Only meaningful on PRs, where we can lint the incoming commit range.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate PR commit messages
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Build directly (no `prisma migrate deploy`) so CI never touches a DB.
      - run: npx next build --webpack

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npx next build --webpack

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Blocking: fail the pipeline on critical vulnerabilities in PRODUCTION
      # dependencies. Dev-only tooling (e.g. semantic-release's bundled npm ->
      # tar) never ships to production, so it is excluded here; those and any
      # high-severity transitive advisories are tracked via Dependabot PRs.
      - name: npm audit (critical, production deps)
        run: npm audit --audit-level=critical --omit=dev

      - name: Check for .env files in repo
        run: |
          if find . -name '.env' -not -path './node_modules/*' -not -path './.git/*' | grep -q .; then
            echo "::error::Found .env files committed to repository!"
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.js' \
            -E '(sk_live_|pk_live_|sk_test_[a-zA-Z0-9]{20,}|password\s*=\s*["\x27][^"\x27]+["\x27])' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . ; then
            echo "::error::Potential hardcoded secrets found!"
            exit 1
          fi

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
