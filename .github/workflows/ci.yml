name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; individual jobs opt into more if needed.
permissions:
  contents: read

env:
  # Shared placeholder env for build/start in CI. These are NOT secrets — they
  # only let Next.js compile and boot for static analysis and smoke tests.
  # Valid-format dummy Clerk key (decodes to clerk.example.com$) so ClerkProvider
  # initializes during prerender without a real key.
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
  CLERK_SECRET_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/dashboard"
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/dashboard"
  UPLOADTHING_TOKEN: "placeholder"
  MUX_TOKEN_ID: "placeholder"
  MUX_TOKEN_SECRET: "placeholder"
  STRIPE_API_KEY: "sk_test_placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  commitlint:
    name: Commit Lint
    # Only meaningful on PRs, where we can lint the incoming commit range.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate PR commit messages
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Domain unit suite: entitlement, RBAC, completion, grading, badges,
      # streaks, and certificate eligibility. Runs with coverage because the
      # per-file thresholds in vitest.config.mts are the gate -- a module in the
      # allow-list that loses coverage fails the build rather than quietly
      # lowering an average. No database, no network: the suite stubs `fetch` to
      # throw. Route, RLS, and transaction coverage is #107; browser journeys
      # are #108.
      - run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 7

  evals:
    name: AI Evaluation Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Structural validation of evals/dataset.v1.jsonl against the safety
      # rubric and thresholds. Does not call a model: the harness that executes
      # these cases against a provider is #79. Stays on the Node built-in test
      # runner: #106 chose Vitest for the TypeScript domain suite and
      # deliberately left these plain-JavaScript document checks alone, since
      # porting them would add risk without adding coverage.
      - run: npm run test:evals

  checks:
    name: Docs & Release Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Keeps the source-of-truth documents honest: every cited path, anchor,
      # Prisma model, and npm script must resolve, and the release matrix's
      # summary counts are asserted from its own tables rather than trusted.
      - run: npm run test:checks

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Build directly (no `prisma migrate deploy`) so CI never touches a DB.
      - run: npx next build --webpack

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Smoke tests use Playwright's Node-based `request` client (no browser),
      # so we intentionally skip `playwright install` — no browser binaries are
      # needed, which keeps this job fast and avoids Chromium CI networking bugs.
      - name: Build app
        run: npx next build --webpack

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Blocking: fail the pipeline on critical vulnerabilities in PRODUCTION
      # dependencies. Dev-only tooling (e.g. semantic-release's bundled npm ->
      # tar) never ships to production, so it is excluded here; those and any
      # high-severity transitive advisories are tracked via Dependabot PRs.
      - name: npm audit (critical, production deps)
        run: npm audit --audit-level=critical --omit=dev

      - name: Check for .env files in repo
        run: |
          if find . -name '.env' -not -path './node_modules/*' -not -path './.git/*' | grep -q .; then
            echo "::error::Found .env files committed to repository!"
            exit 1
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.js' \
            -E '(sk_live_|pk_live_|sk_test_[a-zA-Z0-9]{20,}|password\s*=\s*["\x27][^"\x27]+["\x27])' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . ; then
            echo "::error::Potential hardcoded secrets found!"
            exit 1
          fi

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
